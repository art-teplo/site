# Прод: образы из GHCR, собираются в CI (.github/workflows/ci.yml).
# Запуск на сервере делает .github/workflows/deploy.yml; руками:
#   IMAGE_TAG=main docker compose pull && IMAGE_TAG=main docker compose up -d
name: art-teplo

include:
  - docker-compose.infra.yaml

# Лимит логов Docker: дублирует /etc/docker/daemon.json на сервере (docs/stack.md),
# чтобы лимит жил в git и работал на любой машине
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

x-backend-env: &backend_env
  BACKEND__SECRET_KEY: ${BACKEND__SECRET_KEY}
  BACKEND__DEBUG: ${BACKEND__DEBUG:-0}
  BACKEND__ALLOWED_HOSTS: ${BACKEND__ALLOWED_HOSTS}
  BACKEND__CSRF_TRUSTED_ORIGINS: ${BACKEND__CSRF_TRUSTED_ORIGINS:-}
  BACKEND__CORS_ALLOWED_ORIGINS: ${BACKEND__CORS_ALLOWED_ORIGINS:-}
  BACKEND__ADMIN_PATH: ${BACKEND__ADMIN_PATH:-admin}
  BACKEND__WORKERS: ${BACKEND__WORKERS:-2}
  # URL собираются из паролей выше: пароли — только [A-Za-z0-9] (openssl rand -hex 32)
  BACKEND__DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  BACKEND__CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  BACKEND__CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  BACKEND__S3__ENABLED: ${BACKEND__S3__ENABLED:-0}
  BACKEND__S3__ENDPOINT_URL: ${BACKEND__S3__ENDPOINT_URL:-}
  BACKEND__S3__REGION_NAME: ${BACKEND__S3__REGION_NAME:-}
  BACKEND__S3__ACCESS_KEY_ID: ${BACKEND__S3__ACCESS_KEY_ID:-}
  BACKEND__S3__SECRET_ACCESS_KEY: ${BACKEND__S3__SECRET_ACCESS_KEY:-}
  BACKEND__S3__BUCKET_NAME: ${BACKEND__S3__BUCKET_NAME:-}
  BACKEND__S3__CUSTOM_DOMAIN: ${BACKEND__S3__CUSTOM_DOMAIN:-}
  BACKEND__S3__LOCATION: ${BACKEND__S3__LOCATION:-}
  BACKEND__PUBLIC_URL: ${BACKEND__PUBLIC_URL:-}
  BACKEND__SITE_URL: ${BACKEND__SITE_URL:-}
  BACKEND__TELEGRAM__BOT_TOKEN: ${BACKEND__TELEGRAM__BOT_TOKEN:-}
  BACKEND__TELEGRAM__CHAT_ID: ${BACKEND__TELEGRAM__CHAT_ID:-}
  BACKEND__LEADS__RETENTION_DAYS: ${BACKEND__LEADS__RETENTION_DAYS:-365}
  # Celery зовёт фронт по внутренней сети после правки в админке
  BACKEND__FRONTEND__REVALIDATE_URL: ${BACKEND__FRONTEND__REVALIDATE_URL:-http://web:3000/api/revalidate}
  BACKEND__FRONTEND__REVALIDATE_SECRET: ${BACKEND__FRONTEND__REVALIDATE_SECRET:-}

x-backend: &backend
  image: ghcr.io/art-teplo/site-backend:${IMAGE_TAG:-main}
  init: true
  restart: unless-stopped
  logging: *logging
  environment: *backend_env
  # Файлы заявок: пишет backend, отправляет в Telegram celery_worker
  volumes:
    - private_media:/src/private
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *backend
    command: ["migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # 2 воркера uvicorn по ~240 МБ + главный процесс: ~640 МБ в покое (замер 10.11)
    mem_limit: 1g

  celery_worker:
    <<: *backend
    entrypoint: ["python3", "-m", "celery"]
    command: ["-A", "settings", "worker", "--concurrency=2", "--loglevel=info"]
    mem_limit: 512m

  celery_beat:
    <<: *backend
    entrypoint: ["python3", "-m", "celery"]
    command: ["-A", "settings", "beat", "--loglevel=info"]
    mem_limit: 320m

  # Кнопки «Беру» / «Отказаться»: long polling, только исходящие соединения.
  # Один экземпляр на токен — второй получит от Telegram 409
  telegram_bot:
    <<: *backend
    command: ["runbot"]
    mem_limit: 320m

  # Единственный сервис с портом наружу. TLS добавим при запуске сервера
  nginx:
    image: nginx:1.31.8-alpine
    init: true
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      ADMIN_PATH: ${BACKEND__ADMIN_PATH:-admin}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging

  # Фронт: Next standalone (web/Dockerfile). Снаружи — только через nginx.
  # Адрес бэка (API_URL=http://backend:8000) вшит в образ при сборке
  web:
    image: ghcr.io/art-teplo/site-web:${IMAGE_TAG:-main}
    init: true
    restart: unless-stopped
    environment:
      # Тот же секрет, что у бэка: им Celery и deploy.sh просят обновить страницы
      REVALIDATE_SECRET: ${BACKEND__FRONTEND__REVALIDATE_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

volumes:
  private_media:
